[project]
name = "harnessy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# A test module that uses @tool at import time can't load until the week 3 schema
# exercises are done; report that error and still run every other test.
addopts = "--continue-on-collection-errors"
