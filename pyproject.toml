[project]
name = "harness-cli"
version = "0.1.0"
description = "A Claude Code / Codex style coding agent for the terminal, built on the harnessy harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
harness = "harness_cli.main:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnessy", "harness_cli"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# A test module that uses @tool at import time can't load until the week 3 schema
# exercises are done; report that error and still run every other test.
addopts = "--continue-on-collection-errors"
# A test that hangs (a thread waiting on a queue) dumps its stack instead of hanging silently.
faulthandler_timeout = 60
