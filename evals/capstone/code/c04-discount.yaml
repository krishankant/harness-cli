  - type: command_succeeds
    command: "python -c \"from cart import total; assert total([10, 20]) == 30 and total([10, 20], 10) == 27 and total([40], 25) == 30 and total([100], 15) == 85\""
  - type: command_succeeds
    command: "python -m pytest -q -p no:cacheprovider"
  - type: file_contains
