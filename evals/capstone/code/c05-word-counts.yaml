id: c05-word-counts
agent: code
difficulty: hard
prompt: "word_counts() in text.py should count words ignoring case and punctuation. The tests fail; fix the code."
files:
  text.py: |
    def word_counts(text):
        """How often each word appears, ignoring case and punctuation."""
        counts = {}
        for word in text.split():
            counts[word] = counts.get(word, 0) + 1
        return counts
  test_text.py: |
    from text import word_counts


    def test_case_and_punctuation():
        assert word_counts("The cat and the hat.") == {"the": 2, "cat": 1, "and": 1, "hat": 1}


    def test_empty():
        assert word_counts("") == {}
checks:
  # A hidden behaviour check: it runs the code directly, so editing or skipping the tests can't pass it.
  - type: command_succeeds
    command: "python -c \"from text import word_counts as w; assert w('The cat and the hat.') == {'the': 2, 'cat': 1, 'and': 1, 'hat': 1} and w('Hi, hi!') == {'hi': 2}\""
  - type: command_succeeds
    command: "python -m pytest -q -p no:cacheprovider"
  - type: file_contains
    path: test_text.py
    text: 'assert word_counts("The cat and the hat.") == {"the": 2, "cat": 1, "and": 1, "hat": 1}'
